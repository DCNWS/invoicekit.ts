name: release
# Until the package is on the registry, a release is the only install that
# works: npm takes a tarball over https. The tarball is built and tested here,
# from the Go engine at the release the package version names — the same rule
# publish.yml follows — so what is attached is exactly what the suite just
# validated, and not whatever the engine's default branch happened to be.
#
# It also runs on demand, because a tag pushed by another workflow starts
# nothing: engine-release.yml dispatches it at the tag it has just cut.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the tag to release, e.g. v0.2.5 (default: the ref this ran from)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: DCNWS/invoicekit.go
          path: engine
          fetch-depth: 0        # the tag for this package version has to be present
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
      - name: which tag is this release for?
        id: tag
        env:
          WANT: ${{ inputs.tag }}
        run: |
          set -eu
          tag=$WANT
          [ -n "$tag" ] || tag=$GITHUB_REF_NAME
          ver=$(node -p "require('./package.json').version")
          # The tag names the commit and the version; a run that cannot agree on
          # both would attach a tarball to the wrong release, so it stops here.
          if [ "v$ver" != "$tag" ]; then
            echo "release $tag does not match package.json version $ver" >&2
            exit 1
          fi
          echo "name=$tag" >>"$GITHUB_OUTPUT"
      - name: build the engine release this package version names
        run: |
          set -eu
          ver=$(node -p "require('./package.json').version")
          git -C engine fetch --tags --force
          git -C engine checkout --detach "v$ver"
          printf 'engine %s at %s\n' "$(git -C engine describe --tags)" "$(git -C engine rev-parse --short HEAD)"
      - run: ./scripts/build-wasm.sh engine
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: pack the package
        run: |
          set -eu
          mkdir -p pack
          npm run build
          tarball=$(npm pack --pack-destination pack)
          echo "TARBALL=pack/$tarball" >> "$GITHUB_ENV"
      - name: the tarball carries the licences it must
        # The wasm embeds other people's copyright — the EU's EN 16931
        # Schematrons under EUPL-1.2, KoSIT's and OpenPEPPOL's rules under
        # Apache-2.0 — so a tarball that ships the binary without the notices
        # is a licence breach, not a packaging detail.
        run: |
          set -eu
          contents=$(tar -tzf "$TARBALL")
          for required in NOTICE.md LICENSE LICENSES/EUPL-1.2.txt LICENSES/Apache-2.0.txt; do
            echo "$contents" | grep -q "package/$required" || {
              echo "$required is missing from $TARBALL" >&2
              exit 1
            }
          done
      - name: the packed tarball installs and boots
        run: |
          set -eu
          npm install --no-audit --no-fund --prefix /tmp/consumer "./$TARBALL"
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { loadEinvoice } from "/tmp/consumer/node_modules/@invoicekit/einvoice/dist/index.js";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const einvoice = await loadEinvoice();
          if (einvoice.version !== pkg.version) {
            throw new Error(`tarball reports ${einvoice.version}, package.json says ${pkg.version}`);
          }
          if (einvoice.phases("CII").length === 0) {
            throw new Error("the packed engine boots but knows no phases");
          }
          console.log(`packed engine boots and reports ${einvoice.version}`);
          '
      - name: attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=${{ steps.tag.outputs.name }}
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" --jq .body 2>/dev/null || true)
          # A tag that moves — a rewritten history, a re-dispatch — must not turn
          # into a red run, and must not leave the old tarball attached either.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$TARBALL" --clobber
          else
            gh release create "$tag" "$TARBALL" \
              --title "$tag" \
              --notes "${notes:-The engine this package is named after, built and tested in CI.}"
          fi
