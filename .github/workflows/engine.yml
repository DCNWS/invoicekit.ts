name: engine
# The wasm binary is built from another repository, so this package can be green
# against a binary it shipped months ago and broken against the engine today.
# Weekly, build the current engine tip and run the suite against it. A red run
# here means the two repositories have drifted, not that a commit broke a build.
on:
  schedule:
    - cron: '17 3 * * 1'      # Mondays
  workflow_dispatch:

jobs:
  against-engine-tip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: DCNWS/invoicekit.go
          path: engine
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
      - run: ./scripts/build-wasm.sh engine
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm test
      - name: what the shipped package would weigh
        run: printf 'wasm %s bytes\n' "$(stat -c %s assets/einv.wasm)"
