name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DCNWS/invoicekit.go
          path: ../invoicekit.go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: ./scripts/build-wasm.sh
      - run: npm install
      - run: npm run typecheck
      - run: npm test
