name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      # the current Node release and the LTS line still receiving updates;
      # anything older is out of support and gets no coverage here
      matrix:
        node: ['24', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: DCNWS/invoicekit.go
          path: engine
      - uses: actions/setup-go@v7
        with:
          # the version the engine's go.mod asks for, which is also the version
          # the byte-exact hybrid fixtures were produced by — see NOTICE.md
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: ./scripts/build-wasm.sh engine
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
